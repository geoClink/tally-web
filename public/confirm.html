<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Confirmed — Tally</title>
  <meta name="description" content="Email confirmation for Tally." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://tallytimetracker.com/confirm" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f9f9fb; color: #111; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { background: #fff; border: 1px solid #e8e8ed; border-radius: 16px; padding: 2.5rem 2rem; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.07); }
    .logo { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.03em; background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 1.5rem; display: block; }
    .check { width: 52px; height: 52px; border-radius: 50%; background: #eff6ff; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; }
    .check svg { width: 26px; height: 26px; color: #2563eb; }
    h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
    .status { font-size: 0.95rem; color: #6b7280; margin-bottom: 1.5rem; }
    .fallback { background: #f9f9fb; border: 1px solid #e8e8ed; border-radius: 10px; padding: 1rem 1.25rem; font-size: 0.875rem; color: #6b7280; line-height: 1.6; text-align: left; }
    .fallback a { color: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <span class="logo">Tally</span>
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    </div>
    <h1>Email Confirmed</h1>
    <p class="status" id="status">Opening Tally…</p>
    <div class="fallback">
      <p>If the app didn't open automatically, go back to Tally and sign in with your email and password.</p>
    </div>
  </div>

  <script>
    (function () {
      const hash = window.location.hash;
      if (hash && hash.length > 1) {
        window.location.href = "tally://login-callback" + hash;
      } else {
        document.getElementById("status").textContent = "Your email has been confirmed.";
      }
    })();
  </script>
</body>
</html>
